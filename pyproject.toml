[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-pc"
dynamic = ["version"]
description = "An assistant for Windows that does real work in desktop programs by code: one chat, a key-combo command bar, voice, and 100+ programs."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "FareedKhan-dev" }]
requires-python = ">=3.12,<3.13"
keywords = ["windows", "automation", "assistant", "desktop", "agent"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "comtypes>=1.4.17",
    "ezdxf>=1.4.4",
    "faster-whisper>=1.2.1",
    "genanki>=0.13.1",
    "ifcopenshell>=0.9.0",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "mss>=10.2.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",  # notebooks the Jupyter program writes run with this environment
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pycapcut @ git+https://github.com/GuanYixuan/pyCapCut@27480a1e954740af50363076e6fea94f2893ae93",
    "pyjianyingdraft>=0.3.0",
    "pymongo>=4.18.2",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywin32>=312",
    "segno>=1.6.6",
    "shapely>=2.1.2",
    "uiautomation>=2.0.29",
]

[project.scripts]
ai-pc = "ai_pc.cli.main:main"

[project.gui-scripts]
ai-pc-bar = "ai_pc.assistant.bar:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.hatch.version]
path = "src/ai_pc/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pc"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_pc", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not integration and not live"]
markers = [
    "integration: drives real programs, files and media on this PC (slow; needs tools/, models/ and media/)",
    "live: needs API keys, online accounts or a program on the visible desktop",
]

[tool.ruff]
line-length = 150
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/ai_pc/three/bl"]  # Blender scripts: they run inside Blender's own Python (bpy)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE"]
ignore = [
    "E501",  # line length: the formatter wraps code; long strings and comments are allowed
    "E731",  # small lambdas given a name
    "E741",  # short names such as l in measurement code
    "B007",  # unused loop variables
    "B023",  # closures that use a loop variable: here they always run inside the same iteration
    "B904",  # raise ... from inside except
    "B905",  # zip() without strict=
    "UP031",  # printf-style formatting is allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]
"scripts/**" = ["BLE001"]
"services/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["ai_pc"]

[tool.ruff.format]
line-ending = "lf"


[tool.uv]
environments = ["sys_platform == 'win32'"]  # a Windows program: lock for Windows only
